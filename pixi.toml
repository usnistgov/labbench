[workspace]
authors = ["Dan Kuester <daniel.kuester@nist.gov>"]
channels = ["conda-forge"]
name = "labbench"
platforms = ["osx-arm64", "linux-64", "linux-aarch64", "win-64", "win-arm64"]
# no `version` here: the package version is dynamic, from src/labbench/_version.py

[dependencies]
python = ">=3.12,<3.16"
pip = "*"

# only on conda-forge: the libusb C library that the PyPI `libusb1` binding loads
libusb = "*"

# numerical stack from conda-forge for its optimized builds; everything else is PyPI.
# conda-forge has no pandas or pyarrow builds for win-arm64, so there the whole stack
# comes from PyPI wheels (mixing in conda numpy alone duplicates it)
[target.unix.dependencies]
numpy = ">=1.19"
pandas = ">=1.2.0"
pyarrow = ">=14"

[target.win-64.dependencies]
numpy = ">=1.19"
pandas = ">=1.2.0"
pyarrow = ">=14"

[pypi-dependencies]
labbench = { path = ".", editable = true, extras = ["dev", "jupyter", "pyvisa-py-extras", "pyvicp"] }

# pythonnet only makes sense where a .NET runtime is present
[target.win.pypi-dependencies]
labbench = { path = ".", editable = true, extras = ["dev", "jupyter", "pyvisa-py-extras", "pyvicp", "dotnet"] }

[tasks]
test = "pytest tests"
test-cov = "pytest --cov-report xml:doc/reports/coverage.xml --cov-report term --cov=labbench tests"
coverage-badge = { cmd = "genbadge coverage -i doc/reports/coverage.xml -o doc/reports/coverage.svg -l", depends-on = ["test-cov"] }
lint = "ruff check src tests"
format = "ruff format src tests"
# make_stubs.py resolves the package as Path('labbench'), so it must run from src/
stubs = { cmd = "python ../scripts/make_stubs.py", cwd = "src" }

# conda-forge ships no python 3.12 or 3.13 for win-arm64
[feature.py312]
platforms = ["osx-arm64", "linux-64", "linux-aarch64", "win-64"]

[feature.py312.dependencies]
python = "~=3.12.0"

[feature.py313]
platforms = ["osx-arm64", "linux-64", "linux-aarch64", "win-64"]

[feature.py313.dependencies]
python = "~=3.13.0"

[feature.py314.dependencies]
python = "~=3.14.0"

[feature.py315.dependencies]
python = "~=3.15.0"

[feature.doc.pypi-dependencies]
labbench = { path = ".", editable = true, extras = ["dev", "jupyter", "pyvisa-py-extras", "pyvicp", "doc"] }

[feature.doc.target.win.pypi-dependencies]
labbench = { path = ".", editable = true, extras = ["dev", "jupyter", "pyvisa-py-extras", "pyvicp", "dotnet", "doc"] }

[feature.doc.tasks]
doc = "sphinx-build -b html doc doc/html"
doc-clean = "rm -rf doc/html doc/jupyter_execute"

[environments]
default = ["py314"]
test312 = ["py312"]
test313 = ["py313"]
test314 = ["py314"]
test315 = ["py315"]
doc = ["doc", "py314"]
